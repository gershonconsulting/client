name: Rotate Promote key (client <-> social)

# Generates ONE random key inside the runner and stores it as a Cloudflare
# Pages secret on both projects, so no human (and no AI) ever sees or types it:
#   gershoncrm-client  -> SOCIAL_PROMOTE_KEY  (sent by socialFetch() in src/index.tsx)
#   gershoncrm-social  -> PROMOTE_API_KEY     (checked by /api/report/promote)
# Then redeploys the client so the new secret is live, and waits until the
# social side accepts the key (social picks it up on its next deployment).
#
# Re-run from the Actions tab (workflow_dispatch) any time to rotate the key.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rotate-promote-key.yml']
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Raw `npx wrangler` rejects this repo's Cloudflare token (error 9106 / 6111);
      # cloudflare/wrangler-action accepts it (it is what the deploy workflow uses),
      # so every Cloudflare call goes through the action.
      - name: Generate key
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "PROMOTE_KEY=$KEY" >> "$GITHUB_ENV"
          printf '{"SOCIAL_PROMOTE_KEY":"%s"}' "$KEY" > /tmp/client-secret.json
          printf '{"PROMOTE_API_KEY":"%s"}' "$KEY" > /tmp/social-secret.json

      - name: Store key on gershoncrm-client
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages secret bulk /tmp/client-secret.json --project-name gershoncrm-client

      - name: Store key on gershoncrm-social
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages secret bulk /tmp/social-secret.json --project-name gershoncrm-social

      - name: Remove key files
        if: always()
        run: rm -f /tmp/client-secret.json /tmp/social-secret.json

      - name: Build client
        run: npm run build

      - name: Redeploy client so the secret is live
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name gershoncrm-client --commit-dirty=true

      - name: Wait for social to accept the key (needs its next deployment)
        run: |
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" \
              -H "Authorization: Bearer $PROMOTE_KEY" \
              "https://social.gershoncrm.com/api/report/promote?resource=clients")
            if [ "$CODE" = "200" ]; then
              echo "Social accepted the key. Clients visible to client.gershoncrm.com:"
              node -e "const d=require('/tmp/r.json').data||[];console.log(d.length);console.log(d.map(c=>c.name).join(', '))"
              exit 0
            fi
            echo "attempt $i: social answered $CODE, waiting 30s"
            sleep 30
          done
          echo "Social never accepted the key within 20 minutes."
          exit 1
