name: Straight-in report ID refresh

on:
  push:
    branches: [main]
    paths:
      - 'ops/straightin-report-ids.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, do not write to KV'
        required: false
        default: 'false'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply report IDs to COMPANIES_KV
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/straightin-refresh.mjs

      - name: Commit result log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ops/straightin-refresh-result.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "ops: straight-in refresh result [skip ci]"
            git pull --rebase origin main
            git push
          fi
